<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Godik Trailer · flådestyring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F5F2; --surf:#FFFFFF; --surf2:#FAFAF8;
    --ink:#161A17; --ink2:#3C443E; --muted:#7C857E;
    --line:#E3E6E0; --line2:#EEF0EC;
    --base:#5B6670;      /* hos Godik */
    --placed:#2F6BE4;    /* udstationeret hos Dagrofa */
    --sub:#8A4FD6;       /* udlejet til slutkunde */
    --alert:#D93A45;     /* service / konflikt */
    --land:#E6EAE4; --landline:#D3D9CF;
    --r:14px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:'Schibsted Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:14px;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
  button{font-family:inherit;cursor:pointer}
  ::-webkit-scrollbar{width:10px}
  ::-webkit-scrollbar-thumb{background:#DADED6;border-radius:10px;border:3px solid var(--surf)}

  /* ---------- top ---------- */
  header{display:flex;align-items:center;gap:18px;padding:11px 18px;background:var(--surf);
    border-bottom:1px solid var(--line);position:relative;z-index:10;flex-wrap:wrap}
  header .logo{height:22px;display:block}
  .brandtext{font-size:15px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
  .brandtext span{display:block;font-size:11.5px;font-weight:500;color:var(--muted);letter-spacing:0}
  .mk.free .dot{stroke:var(--godik)}
  .mk.none .dot{stroke:#C3C9C0}
  .mk.blocked .dot{stroke:var(--alert)}
  .row.muted{opacity:.5}
  .seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:2px}
  .seg button{border:0;background:none;padding:7px 14px;border-radius:8px;font-size:13px;
    font-weight:500;color:var(--muted)}
  .seg button.on{background:var(--surf);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.07);font-weight:600}
  .who{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:7px}
  .who i{width:7px;height:7px;border-radius:50%;background:var(--placed);display:block}
  .grow{flex:1}
  .search{position:relative}
  .search input{border:1px solid var(--line);background:var(--surf2);border-radius:10px;
    padding:9px 12px 9px 33px;font-size:13.5px;width:250px;outline:none;color:var(--ink);font-family:inherit}
  .search input:focus{border-color:var(--ink);background:var(--surf)}
  .search svg{position:absolute;left:11px;top:10px;color:var(--muted)}

  /* ---------- layout ---------- */
  .wrap{display:flex;gap:14px;padding:14px;height:calc(100vh - 56px);min-height:0}
  .mapcard{flex:1;min-width:0;background:var(--surf);border:1px solid var(--line);
    border-radius:var(--r);position:relative;overflow:hidden;transition:flex-basis .18s ease}
  .mapcard.small{flex:0 0 300px}
  .mapcard.small .legend{display:none}
  svg#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  svg#map:active{cursor:grabbing}
  .land{fill:var(--land);stroke:var(--landline);stroke-width:1;stroke-linejoin:round}
  .link{stroke:var(--placed);stroke-width:1;opacity:.16;fill:none;pointer-events:none}

  .mk{cursor:pointer}
  .mk .dot{fill:#fff;stroke:var(--base);stroke-width:2.5}
  .mk.placed .dot{stroke:var(--placed)}
  .mk.sub .dot{stroke:var(--sub)}
  .mk.alert .dot{stroke:var(--alert)}
  .mk .cnt{font-size:11.5px;font-weight:700;fill:var(--ink);text-anchor:middle;dominant-baseline:central;pointer-events:none}
  .mk .lbl{font-size:10.5px;font-weight:500;fill:var(--muted);text-anchor:middle;pointer-events:none}
  .mk.on .dot,.mk:hover .dot{fill:var(--placed);stroke:var(--placed)}
  .mk.on.sub .dot,.mk:hover.sub .dot{fill:var(--sub);stroke:var(--sub)}
  .mk.on.alert .dot,.mk:hover.alert .dot{fill:var(--alert);stroke:var(--alert)}
  .mk.on .cnt,.mk:hover .cnt{fill:#fff}
  .mk.on .lbl,.mk:hover .lbl{fill:var(--ink)}
  .mk.dim{opacity:.22}
  .hq{cursor:pointer}
  .hq .badge{fill:#0E9F5B;stroke:#fff;stroke-width:2.5}
  .hq .halo{fill:#0E9F5B;opacity:.14}
  .hq:hover .badge{fill:#0B8A4E}
  .hq text.n{font-size:11.5px;font-weight:700;fill:var(--ink);text-anchor:middle;pointer-events:none}
  .hq text.lbl{font-size:10.5px;font-weight:500;fill:var(--muted);text-anchor:middle;pointer-events:none}
  .hq:hover text.lbl{fill:var(--ink)}

  .legend{position:absolute;left:16px;bottom:16px;background:rgba(255,255,255,.93);
    border:1px solid var(--line);border-radius:12px;padding:11px 13px;backdrop-filter:blur(6px)}
  .legend div{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:5px;color:var(--ink2)}
  .legend i{width:9px;height:9px;border-radius:50%;border:2px solid;display:block}
  .legend p{margin:7px 0 0;font-size:11px;color:var(--muted);max-width:215px;line-height:1.4}
  .zoom{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:6px}
  .zoom button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);
    background:rgba(255,255,255,.95);font-size:15px;color:var(--ink2)}
  .zoom button:hover{background:var(--bg)}

  /* ---------- panel ---------- */
  aside{width:400px;flex:0 0 400px;transition:flex-basis .18s ease;background:var(--surf);border:1px solid var(--line);
    border-radius:var(--r);display:flex;flex-direction:column;min-height:0;overflow:hidden}
  aside.wide{width:auto;flex:1 1 auto}
  .tabs{display:flex;padding:6px;gap:2px;border-bottom:1px solid var(--line)}
  .tabs button{flex:1;border:0;background:none;padding:9px 6px;border-radius:9px;font-size:12.5px;
    font-weight:500;color:var(--muted)}
  .tabs button.on{background:var(--bg);color:var(--ink);font-weight:600}
  .ptop{padding:15px 17px 12px;border-bottom:1px solid var(--line);position:relative}
  .closex{position:absolute;right:13px;top:13px;width:30px;height:30px;border-radius:9px;
    border:1px solid var(--line);background:var(--surf);font-size:17px;line-height:1;color:var(--muted)}
  .closex:hover{background:var(--bg);color:var(--ink)}
  .dgrid{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:26px;align-items:start}
  .pane{max-width:640px}
  .how{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4}
  .smsbox{background:var(--surf2);border:1px solid var(--line);border-radius:12px;
    padding:11px 13px;margin-bottom:9px;font-size:13px;line-height:1.5}
  .smsmeta{font-size:11px;color:var(--muted);margin-bottom:5px}
  .consent{display:flex;gap:10px;align-items:flex-start;margin-top:16px;padding:12px;
    background:var(--surf2);border:1px solid var(--line);border-radius:11px}
  .consent input{margin-top:2px;width:17px;height:17px;flex:0 0 17px;accent-color:var(--placed)}
  .consent span{font-size:12.5px;color:var(--ink2);line-height:1.45}
  .lnk{color:var(--placed);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
  @media (max-width:900px){.dgrid{grid-template-columns:1fr;gap:6px}}
  .ptop h2{margin:0;font-size:19px;font-weight:600;letter-spacing:-.02em}
  .ptop p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
  .back{background:none;border:0;color:var(--muted);font-size:12.5px;padding:0 0 7px}
  .back:hover{color:var(--ink)}
  .scroll{flex:1;overflow-y:auto;padding:14px 20px 30px}

  .stats{display:flex;gap:8px;padding:12px 17px;border-bottom:1px solid var(--line)}
  .st{flex:1;background:var(--surf2);border:1px solid var(--line2);border-radius:11px;padding:9px 10px}
  .st b{display:block;font-size:20px;font-weight:600;letter-spacing:-.03em;line-height:1.15}
  .st span{font-size:10.5px;color:var(--muted);line-height:1.25;display:block;margin-top:2px}

  .row{display:flex;gap:12px;align-items:center;padding:11px 10px;margin:0 -10px;
    border-bottom:1px solid var(--line2);cursor:pointer;border-radius:10px}
  .row:last-child{border-bottom:0}
  .row:hover{background:var(--surf2)}
  .row[data-tr]:hover .reg,.row[data-book]:hover .reg,.row[data-svc]:hover .reg,
  .row[data-loc]:hover .reg{color:var(--placed)}
  .thumb{width:72px;height:48px;border-radius:9px;background:#EDEFEA center/cover no-repeat;flex:0 0 72px}
  .rm{flex:1;min-width:0}
  .reg{font-size:15.5px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
  .sub{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rd{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap;line-height:1.5}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
    padding:3px 9px;border-radius:20px;margin-top:6px;background:var(--bg);color:var(--ink2)}
  .pill i{width:6px;height:6px;border-radius:50%;display:block}
  .h3{font-size:12px;font-weight:600;color:var(--ink2);margin:22px 0 6px;padding-bottom:6px;
    border-bottom:1px solid var(--line)}
  .h3:first-child{margin-top:4px}
  .h3:first-child{margin-top:0}

  .bigph{width:100%;height:190px;border-radius:12px;background:#EDEFEA center/cover no-repeat;margin-bottom:13px}
  .kv{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--line2);font-size:13px}
  .kv span:first-child{color:var(--muted)}
  .kv span:last-child{text-align:right;font-weight:500}

  .chain{border:1px solid var(--line);border-radius:12px;padding:4px 13px;margin:12px 0}
  .step{display:flex;gap:11px;padding:10px 0;position:relative}
  .step+.step{border-top:1px solid var(--line2)}
  .step i{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:0 0 9px}
  .step b{display:block;font-size:13.5px;font-weight:600}
  .step span{font-size:12px;color:var(--muted)}
  .step.off{opacity:.42}

  .alert{border:1px solid #F1C9CC;background:#FDF3F3;border-radius:12px;padding:11px 13px;margin-bottom:12px}
  .alert b{font-size:12.5px;display:block;margin-bottom:2px}
  .alert p{margin:0;font-size:12.5px;color:#8A4147;line-height:1.45}

  .btn{display:block;width:100%;border:1px solid var(--ink);background:var(--ink);color:#fff;
    border-radius:11px;padding:12px;font-size:14px;font-weight:600;margin-top:11px}
  .btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
  .btn:disabled{opacity:.4}
  label.f{display:block;margin-top:12px}
  label.f span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  input.i,select.i,textarea.i{width:100%;font-family:inherit;font-size:14px;padding:10px 11px;
    border:1px solid var(--line);border-radius:10px;background:var(--surf2);color:var(--ink);outline:none}
  input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--ink);background:var(--surf)}
  textarea.i{min-height:80px;resize:vertical}

  .api{background:var(--surf2);border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:12px}
  .api code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--placed)}
  .api div{padding:5px 0;border-bottom:1px solid var(--line2);font-size:12px;color:var(--muted)}
  .api div:last-child{border-bottom:0}

  .dept{border:1px solid var(--line);background:var(--surf2);border-radius:9px;padding:6px 9px;
    font-family:inherit;font-size:12.5px;color:var(--ink);outline:none;max-width:230px}
  .cust circle{fill:var(--sub);stroke:#fff;stroke-width:2;cursor:pointer}
  .cust text{font-size:10px;font-weight:500;fill:var(--sub);text-anchor:middle;pointer-events:none}
  .clink{stroke:var(--sub);stroke-width:1.3;stroke-dasharray:4 3;opacity:.55;fill:none}
  .ghead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    margin:16px 0 2px;padding-bottom:5px;border-bottom:1.5px solid var(--ink)}
  .ghead span{font-size:13px;font-weight:600}
  .ghead em{font-style:normal;font-size:11.5px;color:var(--muted)}
  .cnote{margin:2px 0 8px;font-size:13px}
  .concl{border-radius:11px;padding:11px 13px;font-size:13.5px;font-weight:600;border:1px solid}
  .concl.wait{background:var(--surf2);border-color:var(--line);color:var(--muted)}
  .concl.ok{background:#EEF6EF;border-color:#BFDCC4;color:#1F5B2C}
  .concl.bad{background:#FDF3F3;border-color:#F1C9CC;color:#8A4147}
  .prog{background:var(--surf2);border:1px solid var(--line2);border-radius:10px;
    padding:9px 12px;font-size:12.5px;color:var(--muted);margin-bottom:6px}
  .citem{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2)}
  .citem.flag{background:#FDF3F3;border-radius:8px;padding-left:9px;padding-right:9px}
  .cl{flex:1;font-size:13.5px}
  .tri{display:flex;gap:5px}
  .tri button{border:1px solid var(--line);background:var(--surf);border-radius:8px;
    padding:6px 10px;font-size:12px;font-weight:600;color:var(--ink2)}
  .tri button[data-on="ok"]{background:var(--placed);border-color:var(--placed);color:#fff}
  .tri button[data-on="bad"]{background:var(--alert);border-color:var(--alert);color:#fff}
  .tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;border-radius:9px;
    padding:7px 10px;font-size:12px;z-index:60;display:none;white-space:nowrap;line-height:1.4}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:var(--ink);color:#fff;
    padding:11px 18px;border-radius:11px;font-size:13.5px;z-index:70;display:none}
  @media (max-width:980px){
    body{overflow:auto}
    .wrap{flex-direction:column;height:auto}
    .mapcard{height:50vh}
    .mapcard.small{flex:0 0 auto;height:34vh}
    aside{width:auto;flex:auto}
    .search input{width:170px}
  }
</style>
</head>

/* Bookingens faser. Kunden skal altid kunne se, hvad der sker nu,
   og afdelingen skal kunne se, at der er kommet noget nyt ind. */
const FASE={anmodet:'Afventer bekræftelse',bekraeftet:'Bekræftet',
  udleveret:'Udleveret til kunden',afleveret:'Afleveret',afvist:'Afvist'};
function seedFaser(){
  const t=iso(TODAY);
  SUBS.forEach(b=>{ if(b.fase) return;
    b.fase = b.t<t ? 'afleveret' : (b.f<=t ? 'udleveret' : 'bekraeftet');
    if(b.fase!=='anmodet') b.pickupOk=true;
  });
}
function bookState(b){
  if(b.st==='Afsluttet') return 'Afsluttet';
  if(D(b.t)<TODAY) return 'Afsluttet';
  if(D(b.f)<=TODAY&&D(b.t)>=TODAY) return 'I gang';
  return 'Kommende';
}
function recalc(){
  seedFaser();
  SUBS.forEach(b=>b.state=bookState(b));
  TRAILERS.forEach(t=>{
    t.subs=SUBS.filter(b=>b.r===t.r).sort((a,b)=>D(a.f)-D(b.f));
    t.active=t.subs.find(b=>b.state==='I gang')||null;
    t.next=t.subs.find(b=>b.state==='Kommende')||null;
    t.svc=SERVICE.find(s=>s.r===t.r&&s.st!=='Afsluttet')||null;
    t.atGodik=!!(t.svc&&t.svc.st==='På værksted');
    t.ude=t.subs.find(b=>b.fase==='udleveret')||null;   /* fysisk hos kunden */
    t.here=t.atGodik||t.ude?null:t.l;
    t.hist=SERVICE.filter(x=>x.r===t.r&&x.st==='Afsluttet');
    t.insp=INSPECTIONS.filter(i=>i.r===t.r);
    t.pl=ORDER(t.o);
    /* En trailer med en fejlet kontrol er spærret, indtil afdelingen
       enten selv udbedrer fejlen eller servicen er afsluttet. */
    t.state=t.atGodik?'base':t.blk?'blocked':t.svc?'service':t.ude?'sub':t.active?'sub':'placed';
    t.bookable=!!t.here&&!t.svc&&!t.blk;
    t.reserved=t.subs.some(b=>b.fase==='anmodet'||b.fase==='bekraeftet');
  });
  LOCS.forEach(l=>{
    l.tr=TRAILERS.filter(t=>t.here===l.c);
    l.free=l.tr.filter(t=>t.bookable&&!t.active&&!t.reserved);
    l.nye=SUBS.filter(b=>b.l===l.c&&b.fase==='anmodet');
    l.unnum=UNNUMBERED.filter(b=>b.l===l.c);
    l.svc=SERVICE.filter(s=>s.l===l.c&&s.st!=='Afsluttet');
    l.blk=l.tr.filter(t=>t.blk);
    l.out=l.tr.filter(t=>t.active).length;
    l.state=l.svc.length||l.blk.length?'alert':l.out?'sub':'placed';
  });
}

const zoom=f=>{const v=view.slice(),cx=v[0]+v[2]/2,cy=v[1]+v[3]/2;
  v[2]*=f;v[3]*=f;v[0]=cx-v[2]/2;v[1]=cy-v[3]/2;setView(v)};

/* Kortet skal både kunne trækkes og klikkes.
   Museklik må ikke opfanges af panoreringen, så vi fanger først markøren,
   når fingeren eller musen faktisk har bevæget sig. */
let drag=null, panned=false;
svg.addEventListener('pointerdown',e=>{
  drag={x:e.clientX,y:e.clientY,v:view.slice(),id:e.pointerId,moved:false};
  panned=false;
});
svg.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if(!drag.moved){
    if(Math.hypot(dx,dy)<5)return;            /* under 5 px er et klik, ikke et træk */
    drag.moved=true;
    try{svg.setPointerCapture(e.pointerId)}catch(_){}
  }
  const k=view[2]/svg.clientWidth;
  setView([drag.v[0]-dx*k, drag.v[1]-dy*k, drag.v[2], drag.v[3]]);
});
function endDrag(e){
  if(!drag)return;
  if(drag.moved){
    panned=true;                               /* undertryk klikket efter et træk */
    try{svg.releasePointerCapture(drag.id)}catch(_){}
    setTimeout(()=>panned=false,0);
  }
  drag=null;
}
svg.addEventListener('pointerup',endDrag);
svg.addEventListener('pointercancel',endDrag);
addEventListener('pointerup',endDrag);
svg.addEventListener('click',e=>{ if(panned){e.stopPropagation();e.preventDefault()} },true);

  const right=`<div class="h3">Forløb</div>${plan}
    ${godik?godikActions(s):`<div class="sub" style="white-space:normal">Godik Power melder datoerne tilbage her, så snart servicen er planlagt.</div>`}`;
  sc.innerHTML=`<div class="dgrid"><div>${left}</div><div>${right}</div></div>`;
  if(godik) wireActions(s);
}
function godikActions(s){
  const plus=n=>iso(new Date(TODAY.getTime()+n*864e5));
  const mode=`<div class="h3">Sådan løser vi det</div>
    <label class="f"><span>Løsning</span><select class="i" id="a-mode">
      <option value="afhent" ${s.mode==='afhent'?'selected':''}>Vi henter traileren til Ejby</option>
      <option value="onsite" ${s.mode==='onsite'?'selected':''}>Tekniker kører ud til afdelingen</option>
    </select></label>`;
  const besked=`<label class="f"><span>Besked til afdelingen</span><textarea class="i" id="a-svar" placeholder="Kort besked, som Dagrofa kan se">${esc(s.svar)}</textarea></label>`;
  if(s.st==='Modtaget'||s.st==='Planlagt'){
    const datoer=s.mode==='onsite'
      ? `<label class="f"><span>Tekniker kører ud</span><input class="i" type="date" id="a-besog" value="${s.besog||plus(3)}"></label>`
      : `<label class="f"><span>Vi henter traileren</span><input class="i" type="date" id="a-afhent" value="${s.afhent||plus(3)}"></label>
         <label class="f"><span>Vi leverer den tilbage</span><input class="i" type="date" id="a-retur" value="${s.retur||plus(8)}"></label>`;
    return mode+datoer+besked
      +`<button class="btn" id="a-plan">${s.st==='Planlagt'?'Gem ændringer':'Bekræft og send til Dagrofa'}</button>`
      +(s.st==='Planlagt'?(s.mode==='onsite'
          ?`<button class="btn ghost" id="a-done">Arbejdet er udført</button>`
          :`<button class="btn ghost" id="a-pick">Traileren er hentet</button>`):'');
  }
  if(s.st==='På værksted') return `<div class="h3">På værkstedet i Ejby</div>
    <label class="f"><span>Forventet retur</span><input class="i" type="date" id="a-retur" value="${s.retur}"></label>
    ${besked}<button class="btn ghost" id="a-plan">Gem</button>
    <button class="btn" id="a-done">Traileren er leveret tilbage</button>`;
  return `<div class="h3">Afsluttet ${dk(s.udfort)}</div>
    <div class="sub">${s.mode==='onsite'?'Arbejdet blev udført på adressen.':'Traileren står igen hos Dagrofa.'}</div>`;
}
function wireActions(s){
  const g=id=>document.getElementById(id);
  if(g('a-mode')) g('a-mode').onchange=e=>{s.mode=e.target.value;render()};
  if(g('a-plan')) g('a-plan').onclick=()=>{
    if(g('a-afhent')) s.afhent=g('a-afhent').value;
    if(g('a-retur'))  s.retur=g('a-retur').value;
    if(g('a-besog'))  s.besog=g('a-besog').value;
    if(g('a-svar'))   s.svar=g('a-svar').value.trim();
    if(s.st==='Modtaget') s.st='Planlagt';
    render(); toast('Datoer sendt til Dagrofa '+byLoc(s.l).n);
  };
  if(g('a-pick')) g('a-pick').onclick=()=>{s.st='På værksted';render();toast(s.r+' er nu i Ejby')};
  if(g('a-done')) g('a-done').onclick=()=>{
    s.st='Afsluttet'; s.udfort=iso(TODAY);
    const t=byReg(s.r);
    if(t.blk){t.blk=null; toast(s.r+' er repareret og kan bookes igen')}
    else toast(s.mode==='onsite'?'Servicen er registreret som udført':s.r+' er tilbage hos Dagrofa');
    render();
  };
}

/* ---------- booking ---------- */
function bookView(ptop,sc,godik){
  const b=SUBS.find(x=>x.o===S.book); if(!b){S.book=null;return render()}
  const l=byLoc(b.l), t=b.r?byReg(b.r):null;
  const kunde=isKunde(), dag=S.app==='dagrofa';
  const pickup=INSPECTIONS.find(i=>i.o===b.o&&i.phase==='afhentning');
  const ret=INSPECTIONS.find(i=>i.o===b.o&&i.phase==='aflevering');

  ptop.innerHTML=`<button class="back" data-back="root">← Tilbage</button>
    <button class="closex" data-back="root" title="Luk">×</button>
    <h2>${kunde?SPECS[t.t].navn:esc(b.k)}</h2>
    <p>${FASE[b.fase]} · ${kunde?PARTNER+' '+esc(l.n):'Dagrofa '+esc(l.n)+' · ordre '+b.o}</p>`;

  /* Hvad sker der lige nu, skrevet til den rolle der kigger */
  let nu='', tone='wait';
  if(b.fase==='anmodet') nu=kunde
    ? 'Afdelingen bekræfter din booking. Kør ikke afsted endnu – du får besked her.'
    : 'Ny anmodning. Bekræft eller afvis, så kunden ved, om traileren er klar.';
  else if(b.fase==='bekraeftet'&&!pickup){tone='ok';nu=kunde
    ? `Bekræftet. Hent traileren hos ${PARTNER} ${l.n}, ${l.a}, ${l.z}, fra ${dk(b.f)}. Tag kørekort med. Når du står ved vognen, laver du den visuelle kontrol her.`
    : 'Bekræftet. Kunden gennemgår vognen ved afhentning.';}
  else if(b.fase==='bekraeftet'&&pickup&&!pickup.faults.length){tone='ok';nu=kunde
    ? 'Kontrollen er godkendt. Afdelingen udleverer nøglen.'
    : 'Kunden har godkendt kontrollen. Udlever nøglen og tryk Udlever trailer.';}
  else if(b.fase==='bekraeftet'&&pickup&&pickup.faults.length){tone='bad';nu=kunde
    ? `Der blev fundet fejl. Kontakt ${PARTNER} ${l.n} på 70 20 18 16 – vi finder en anden trailer.`
    : 'Kunden fandt fejl ved afhentning. Traileren er spærret. Find en anden vogn til kunden.';}
  else if(b.fase==='udleveret'){tone='ok';nu=kunde
    ? `Du har traileren. Aflever den senest ${dk(b.t)} hos ${PARTNER} ${l.n}, og lav kontrollen ved aflevering.`
    : `Hos kunden${b.by?' i '+esc(b.by):''}. Retur ${dk(b.t)}.`;}
  else if(b.fase==='afleveret') nu=kunde?'Afleveret. Tak for lån.':'Afleveret og afsluttet.';
  else if(b.fase==='afvist') {tone='bad';nu=kunde?'Afdelingen kunne ikke bekræfte bookingen.':'Afvist.';}

  const trin=[['anmodet','Booket'],['bekraeftet','Bekræftet'],['udleveret','Udleveret'],['afleveret','Afleveret']];
  const naaet=trin.findIndex(([k])=>k===b.fase);
  const chain=`<div class="chain">${trin.map(([k,label],i)=>{
    const on=b.fase!=='afvist'&&i<=naaet;
    const naar=k==='anmodet'?dk(b.oprettet||b.f)
      :k==='bekraeftet'?(b.bekraeftet?dk(b.bekraeftet):'')
      :k==='udleveret'?(b.udleveret?dk(b.udleveret):dk(b.f))
      :(b.fase==='afleveret'?dk(b.t):'');
    return `<div class="step ${on?'':'off'}"><i style="background:${on?'var(--placed)':'var(--line)'}"></i>
      <div><b>${label}</b><span>${on&&naar?naar:'ikke endnu'}</span></div></div>`}).join('')}</div>`;

  const left=`${t?`<div class="bigph" style="background-image:url(${IMG[t.t]})"></div>`:''}
    <div class="concl ${tone}">${nu}</div>
    ${kunde?'':`<div class="kv"><span>Trailer</span><span>${b.r?`<a class="lnk" data-tr="${b.r}">${b.r}</a> · ${SPECS[t.t].navn}`:'ikke angivet'}</span></div>`}
    <div class="kv"><span>Periode</span><span>${dk(b.f)} – ${dk(b.t)}</span></div>
    <div class="kv"><span>${kunde?'Hentes hos':'Afdeling'}</span><span>${kunde?PARTNER+' '+esc(l.n):'Dagrofa '+esc(l.n)+' · '+l.c}</span></div>
    <div class="kv"><span>Adresse</span><span>${esc(l.a)}<br>${esc(l.z)}</span></div>
    ${kunde?'':`${b.att?`<div class="kv"><span>Kontaktperson</span><span>${esc(b.att)}</span></div>`:''}
      ${b.tlf?`<div class="kv"><span>Telefon</span><span>${esc(b.tlf)}${b.verificeret?' · bekræftet med kode':''}</span></div>`:''}
      <div class="kv"><span>Brugsadresse</span><span>${b.adr?esc(b.adr)+'<br>'+esc(b.post)+' '+esc(b.by):'ikke oplyst'}</span></div>`}`;

  const inspBlock=i=>i
    ? `<div class="concl ${i.faults.length?'bad':'ok'}">${i.faults.length
        ?'Fejl fundet på '+i.faults.length+' punkt'+(i.faults.length>1?'er':''):'Alt i orden'}</div>
       <div class="sub" style="white-space:normal;margin-top:6px">
       ${i.faults.length?i.faults.map(f=>'<b>'+esc(f.i)+'</b><br>'+esc(f.note)).join('<br><br>'):'Alle punkter tjekket.'}
       <br><br>${dk(i.at)} · ${esc(i.af)}</div>`
    : '<div class="sub">Ikke gennemført endnu.</div>';

  const handling=
    (dag&&b.fase==='anmodet'?`<div class="h3">Ny anmodning</div>
      <div style="display:flex;gap:9px"><button class="btn" style="margin:0" data-ok="${b.o}">Bekræft booking</button>
      <button class="btn ghost" style="margin:0" data-no="${b.o}">Afvis</button></div>`:'')
    +(dag&&b.fase==='bekraeftet'&&pickup&&!pickup.faults.length
      ?`<div class="h3">Udlevering</div><button class="btn" data-out="${b.o}">Udlever trailer til kunden</button>`:'')
    +(dag&&b.fase==='bekraeftet'&&!pickup
      ?`<div class="h3">Udlevering</div><div class="sub">Afventer kundens kontrol ved afhentning.</div>`:'');

  const right=`<div class="h3">Forløb</div>${chain}${handling}
    <div class="h3">Kontrol ved afhentning</div>
    ${inspBlock(pickup)}
    ${!pickup&&b.fase==='bekraeftet'&&(kunde||dag)
      ?`<button class="btn" data-form="check-afhentning-${b.o}">Start kontrol ved afhentning</button>`:''}
    ${!pickup&&b.fase==='anmodet'?'<div class="sub">Kan først laves, når afdelingen har bekræftet.</div>':''}
    <div class="h3">Kontrol ved aflevering</div>
    ${inspBlock(ret)}
    ${b.fase==='udleveret'&&!ret&&(kunde||dag)
      ?`<button class="btn" data-form="check-aflevering-${b.o}">Start kontrol ved aflevering</button>`:''}
    ${b.fase!=='udleveret'&&!ret?'<div class="sub">Kan først laves, når traileren er udleveret.</div>':''}
    ${!kunde&&SMS.filter(m=>m.o===b.o).length?`<div class="h3">Sendt til kunden</div>`
      +SMS.filter(m=>m.o===b.o).map(m=>`<div class="smsbox"><div class="smsmeta">SMS · ${dk(m.at)} ${m.tid} · ${esc(m.tlf)}</div><div>${esc(m.txt)}</div></div>`).join(''):''}
    ${dag&&b.fase!=='afleveret'&&b.fase!=='afvist'?`
      <div class="h3">Ret bookingen</div>
      <label class="f"><span>Slutdato</span><input class="i" type="date" id="b-til" value="${b.t}"></label>
      <button class="btn ghost" id="b-save">Gem ændring</button>
      <button class="btn ghost" id="b-cancel">Annuller bookingen</button>`:''}`;

  sc.innerHTML=`<div class="dgrid"><div>${left}</div><div>${right}</div></div>`;

  if(dag&&b.fase!=='afleveret'&&b.fase!=='afvist'){
    const g=id=>document.getElementById(id);
    if(g('b-save')) g('b-save').onclick=()=>{
      const v=g('b-til').value; if(!v||D(v)<D(b.f))return toast('Slutdato skal ligge efter startdato');
      b.t=v; render(); toast('Booking opdateret');
    };
    if(g('b-cancel')) g('b-cancel').onclick=()=>{
      SUBS=SUBS.filter(x=>x.o!==b.o); S.book=null; render(); toast('Bookingen er annulleret');
    };
  }
}

/* Bekraeftelse af mobilnummeret. Uden den kan hvem som helst booke i andres navn,

  const p=S.pending; if(!p){S.form=null;return render()}
  const t=byReg(p.reg), l=byLoc(t.l);
  ptop.innerHTML=`<button class="back" data-back="root">← Fortryd</button>

        style="font-size:24px;letter-spacing:.4em;text-align:center"></label>

  g('u-save').onclick=()=>{
    const k=g('u-k').value.trim(),tlf=g('u-tlf').value.trim(),adr=g('u-adr').value.trim(),
          post=g('u-post').value.trim(),f=g('u-f').value,t=g('u-t').value,r=g('u-tr').value;
    if(!k||!tlf||!adr||!post) return toast('Udfyld kunde, telefon og adresse');
    if(!POSTNR[post]) return toast('Ukendt postnummer');
    if(!f||!t||D(t)<D(f)) return toast('Tjek datoerne');
    if(!freeIn(r,f,t)) return toast(r+' er allerede udlejet i den periode');
    const tr=byReg(r), p=POSTNR[post];
    const o='D-'+(4100+SUBS.filter(b=>String(b.o).startsWith('D-')).length+1);
    SUBS.push({o,r,l:tr.l,f,t,k,att:g('u-att').value.trim(),tlf,adr,post,by:p[2],
      lat:p[0],lng:p[1],kt:g('u-kt').value.trim(),st:'Aktiv',
      fase:'bekraeftet',oprettet:iso(TODAY),bekraeftet:iso(TODAY)});
    S.form=null;S.book=o;render();
    toast('Udlejningen er oprettet');
  };
}

/* ---------- visuel kontrol, både ved afhentning og aflevering ---------- */
function checkForm(ptop,sc){
  const parts=S.form.split('-'), phase=parts[1], b=SUBS.find(x=>x.o===parts.slice(2).join('-'));
  if(!b){S.form=null;return render()}
  const t=byReg(b.r), l=byLoc(b.l), kunde=isKunde();
  S.cnotes=S.cnotes||{};
  ptop.innerHTML=`<button class="back" data-back="root">← Fortryd</button>
    <button class="closex" data-back="root" title="Luk">×</button>
    <h2>Visuel kontrol</h2>
    <p>${phase==='afhentning'?'Ved afhentning':'Ved aflevering'} · ${kunde?SPECS[t.t].navn:b.r+' · '+esc(b.k)}</p>`;
  const done=CHECKALL.filter(i=>S.chk[i]).length, faults=CHECKALL.filter(i=>S.chk[i]==='fejl');
  const alt=done===CHECKALL.length&&!faults.length;
  sc.innerHTML=`<div class="pane"><div class="prog">Tjekkes med øjne og hænder. Der skal hverken bil eller strøm til.</div>`
    +CHECK.map(c=>`<div class="ghead"><span>${c.g}</span>${c.hint?`<em>${c.hint}</em>`:''}</div>`
      +c.items.map(i=>{const a=S.chk[i];
        return `<div class="citem ${a==='fejl'?'flag':''}"><div class="cl">${i}${HOW[i]?`<em class="how">${HOW[i]}</em>`:''}</div><div class="tri">
          <button data-chk="${i}" data-val="ok" ${a==='ok'?'data-on="ok"':''}>Ok</button>
          <button data-chk="${i}" data-val="fejl" ${a==='fejl'?'data-on="bad"':''}>Fejl</button></div></div>`
          +(a==='fejl'?`<input class="i cnote" data-note="${i}" placeholder="Bemærkning" value="${esc(S.cnotes[i]||'')}">`:'')}).join('')).join('')
    +`<div class="sub" style="margin-top:14px">Alle punkter tjekkes, mens vognen holder stille.
        Du skal ikke køre for at kunne svare.</div>
      <div class="h3">Konklusion</div>
      <div class="concl ${done<CHECKALL.length?'wait':alt?'ok':'bad'}">${
        done<CHECKALL.length?`${done} af ${CHECKALL.length} punkter tjekket`
        :alt?'Alt i orden':`Fejl fundet på ${faults.length} punkt${faults.length>1?'er':''} – ring 70 20 18 16`}</div>
      <label class="f"><span>Kontrolleret af</span><input class="i" id="c-af" value="${esc(S.chkaf||'')}" placeholder="${kunde?'Dit navn':'Navn og afdeling'}"></label>
      <button class="btn" id="c-done" ${done<CHECKALL.length?'disabled':''}>${
        done<CHECKALL.length?'Tjek alle punkter':alt?'Godkend':'Meld fejl'}</button></div>`;
  const grab=()=>{
    const af=document.getElementById('c-af'); if(af) S.chkaf=af.value;
    sc.querySelectorAll('[data-note]').forEach(n=>S.cnotes[n.dataset.note]=n.value);
  };
  sc.querySelectorAll('[data-chk]').forEach(btn=>btn.onclick=()=>{
    grab(); const k=btn.dataset.chk;
    S.chk[k]=S.chk[k]===btn.dataset.val?null:btn.dataset.val;
    if(!S.chk[k]){delete S.chk[k];delete S.cnotes[k]}
    render();
  });
  sc.querySelectorAll('[data-note]').forEach(n=>n.onchange=grab);
  const dn=document.getElementById('c-done');
  if(dn) dn.onclick=()=>{
    grab();
    if(!S.chkaf) return toast('Skriv hvem der har kontrolleret vognen');
    if(faults.some(f=>!(S.cnotes[f]||'').trim())) return toast('Skriv en bemærkning ved hver fejl');
    const list=faults.map(f=>({i:f,note:(S.cnotes[f]||'').trim()}));
    INSPECTIONS.unshift({o:b.o,r:b.r,l:b.l,phase,at:iso(TODAY),faults:list,af:S.chkaf,
      by:kunde?'kunde':'afdeling'});
    if(list.length){
      /* Traileren spærres for nye bookinger, indtil afdelingen frigiver den. */
      t.blk={at:iso(TODAY),af:S.chkaf,phase,items:list};
      sms(b,phase==='afhentning'
        ? `Der blev fundet fejl på vognen. Kør ikke afsted. Ring til ${PARTNER} ${byLoc(b.l).n} på 70 20 18 16.`
        : `Tak. Vi har noteret bemærkningerne fra afleveringen.`,false);
      if(phase==='aflevering'){b.st='Afsluttet';b.fase='afleveret';b.t=iso(TODAY)}
    }else{
      if(phase==='afhentning'){b.pickupOk=true;
        sms(b,`Kontrollen er godkendt. Afdelingen udleverer nøglen til dig nu.`,false)}
      else {b.st='Afsluttet';b.fase='afleveret';b.t=iso(TODAY);
        sms(b,`Traileren er registreret som afleveret uden bemærkninger. Tak for lån.`,false)}
    }
    S.form=null;S.chk={};S.cnotes={};S.chkaf='';S.book=b.o;
    render();
    toast(list.length
      ? 'Fejlen er meldt. Traileren er spærret, indtil den er udbedret.'
      : phase==='afhentning'?'Godkendt. God tur.':'Tak, traileren er afleveret.');
  };
}

/* ---------- serviceanmodning fra afdelingen ---------- */
function serviceForm(ptop,sc){
  const pre=S.form.startsWith('new-')?S.form.slice(4):'';
  ptop.innerHTML=`<button class="back" data-back="root">← Fortryd</button>
    <button class="closex" data-back="root" title="Luk">×</button>
    <h2>Anmod om service</h2><p>Sendes til Godik Power</p>`;
  const list=TRAILERS.filter(t=>inScope(t.l)&&!t.svc);
  sc.innerHTML=`<div class="pane">
    <label class="f"><span>Trailer</span><select class="i" id="f-tr">${list.map(t=>
      `<option value="${t.r}" ${t.r===pre?'selected':''}>${t.r} · ${SPECS[t.t].navn} · ${byLoc(t.l).n}</option>`).join('')}</select></label>
    <label class="f"><span>Hvad er der galt</span><select class="i" id="f-fejl">
      ${['Køleanlæg','Pakninger','Lys og el','Døre og låse','Hjul og dæk','Støtteben og træk','Indvendig skade','Andet'].map(x=>`<option>${x}</option>`).join('')}</select></label>
    <label class="f"><span>Beskrivelse</span><textarea class="i" id="f-txt" placeholder="Hvad sker der, og hvornår opstod det"></textarea></label>
    <label class="f"><span>Afdeling og navn</span><input class="i" id="f-af" placeholder="F.eks. Dagrofa Esbjerg · 185"></label>
    <button class="btn" id="f-send">Send anmodning</button></div>`;
  document.getElementById('f-send').onclick=()=>{
    const txt=document.getElementById('f-txt').value.trim(),af=document.getElementById('f-af').value.trim();
    if(!txt||!af)return toast('Udfyld beskrivelse og afdeling');
    const r=document.getElementById('f-tr').value,t=byReg(r);
    const id='S-'+(2043+SERVICE.length);
    SERVICE.unshift({id,r,l:t.l,fejl:document.getElementById('f-fejl').value,txt,af,
      at:iso(TODAY),st:'Modtaget',mode:'afhent',afhent:'',retur:'',besog:'',udfort:'',svar:''});
    S.form=null;S.tab='svc';S.svc=id;render();
    toast('Anmodningen ligger nu hos Godik Power');
  };
}

function formView(ptop,sc){
  if(S.form==='otp')              return otpForm(ptop,sc);
  if(S.form.startsWith('book-'))  return bookingForm(ptop,sc);
  if(S.form.startsWith('check-')) return checkForm(ptop,sc);
  if(S.form.startsWith('udlej'))  return udlejForm(ptop,sc);
  return serviceForm(ptop,sc);
}

function toast(m){const el=document.getElementById('toast');el.textContent=m;el.style.display='block';
  clearTimeout(el._t);el._t=setTimeout(()=>el.style.display='none',3200)}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-app],[data-tab],[data-loc],[data-tr],[data-svc],[data-back],[data-form],[data-book],[data-free],[data-order],[data-ok],[data-no],[data-out],[data-page]');
  if(!b)return;
  if(b.dataset.app){
    S=Object.assign(S,{app:b.dataset.app,sel:null,trailer:null,svc:null,book:null,form:null,page:null,dept:null,chk:{},cnotes:{}});
    S.tab=b.dataset.app==='kunde'?'ledige':'flaade';
    setView(VB.slice());
  }
  else if(b.dataset.tab){S.tab=b.dataset.tab;S.sel=null;S.trailer=null;S.svc=null;S.book=null;S.form=null;S.page=null;
    if(b.dataset.tab!=='flaade'&&b.dataset.tab!=='ledige')setView(VB.slice());}
  else if(b.dataset.back){S.svc=null;S.form=null;S.book=null;S.page=null;
    if(b.dataset.back==='loc'&&S.trailer){S.trailer=null}
    else{S.trailer=null;S.sel=null;setView(VB.slice())}}
  else if(b.dataset.loc){S.sel=b.dataset.loc;S.trailer=null;focus(byLoc(b.dataset.loc))}
  else if(b.dataset.tr){const t=byReg(b.dataset.tr);S.trailer=t.r;S.sel=t.l;S.svc=null;S.book=null;focus(byLoc(t.l))}
  else if(b.dataset.svc){S.svc=b.dataset.svc}
  else if(b.dataset.book){S.book=b.dataset.book;S.trailer=null}
  else if(b.dataset.page){S.page=b.dataset.page;S.form=null}
  else if(b.dataset.ok){
    const x=SUBS.find(v=>v.o===b.dataset.ok);
    x.fase='bekraeftet'; x.bekraeftet=iso(TODAY);
    const lx=byLoc(x.l);
    sms(x,`Din trailer er klar. Hentes hos ${PARTNER} ${lx.n}, ${lx.a}, ${lx.z} fra ${dk(x.f)}. `
      +`Husk kørekort. Åbn linket og tryk Start kontrol, når du står ved vognen:`);
    toast('Bekræftet. SMS med link sendt til '+x.tlf);
  }
  else if(b.dataset.no){
    const x=SUBS.find(v=>v.o===b.dataset.no);
    x.fase='afvist'; x.st='Afsluttet';
    sms(x,`Vi kan desværre ikke bekræfte din booking hos ${PARTNER} ${byLoc(x.l).n}. `
      +`Ring til afdelingen på 70 20 18 16, så finder vi en anden løsning.`,false);
    toast('Afvist. Kunden har fået besked på SMS.');
  }
  else if(b.dataset.out){
    const x=SUBS.find(v=>v.o===b.dataset.out);
    x.fase='udleveret'; x.udleveret=iso(TODAY);
    sms(x,`God tur. Aflever traileren senest ${dk(x.t)} hos ${PARTNER} ${byLoc(x.l).n}. `
      +`Husk kontrollen ved aflevering. Den ligger her:`);
    toast('Udleveret. SMS med afleveringsdato sendt.');
  }
  else if(b.dataset.free){
    const t=byReg(b.dataset.free); t.blk=null;
    toast(t.r+' er frigivet og kan bookes igen');
  }
  else if(b.dataset.order){
    const t=byReg(b.dataset.order);
    if(!t.svc){
      SERVICE.unshift({id:'S-'+(2043+SERVICE.length),r:t.r,l:t.l,fejl:'Fundet ved visuel kontrol',
        txt:t.blk.items.map(f=>f.i+': '+f.note).join('. '),af:'Dagrofa '+byLoc(t.l).n,
        at:iso(TODAY),st:'Modtaget',mode:'afhent',afhent:'',retur:'',besog:'',udfort:'',svar:''});
      toast('Serviceanmodning sendt til Godik Power');
    }
  }
  else if(b.dataset.form){S.form=b.dataset.form;
    if(b.dataset.form.startsWith('check-')){S.chk={};S.cnotes={};S.chkaf=''}}
  render();
});
document.getElementById('q').addEventListener('input',e=>{
  S.q=e.target.value.trim();S.sel=null;S.trailer=null;S.svc=null;S.book=null;S.form=null;
  S.tab=isKunde()?'ledige':'flaade';render()});

render();

</script>
</body>
</html>
