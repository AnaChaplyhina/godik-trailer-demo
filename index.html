<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trailerudlejning</title>
<meta name="description" content="Book en køle- eller frysetrailer i din afdeling.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header>
  <img class="logo" id="logo" src="assets/logo.png" alt="Godik">
  <div class="brandtext" id="brandtext"></div>
  <div class="seg" id="appseg">
    <button data-app="kunde" class="on">Kunde</button>
    <button data-app="dagrofa">Dagrofa</button>
    <button data-app="godik">Godik Power</button>
  </div>
  <div class="who" id="who"><i></i><span></span></div>
  <div class="grow"></div>
  <div class="search">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" placeholder="Nummerplade, afdeling eller kunde" autocomplete="off">
  </div>
</header>

<div class="wrap">
  <div class="mapcard">
    <svg id="map" viewBox="0 0 1000 812.3" preserveAspectRatio="xMidYMid meet">
      <g id="gland"></g>
      <g id="glink"></g>
      <g id="gmark"></g>
    </svg>
    <div class="legend" id="legend"></div>
    <div class="zoom">
      <button id="zin">+</button><button id="zout">−</button><button id="zres">⤢</button>
    </div>
  </div>
  <aside>
    <div class="tabs" id="tabs"></div>
    <div class="ptop" id="ptop"></div>
    <div id="statbox"></div>
    <div class="scroll" id="scroll"></div>
  </aside>
</div>
<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>

<!-- Data foerst, saa logik, til sidst opstart. Raekkefoelgen betyder noget. -->
<script src="data/denmark.js"></script>
<script src="data/postnr.js"></script>

<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/map.js"></script>
<script src="js/components.js"></script>
<script src="js/render.js"></script>
<script src="js/views-customer.js"></script>
<script src="js/views-partner.js"></script>
<script src="js/views-service.js"></script>
<script src="js/views-booking.js"></script>
<script src="js/forms.js"></script>
<script src="js/app.js"></script>
</body>
</html>
